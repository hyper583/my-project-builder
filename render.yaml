# Deployment blueprint.
#
# TWO services, and that is the whole reason this file exists. Generation runs
# in a separate long-lived process so it survives the student closing the tab —
# which means a platform that only runs request handlers cannot host this app.
# On a web-only deploy the queue fills and nothing ever claims from it: every
# project sits at "Generating" forever, and nothing reports an error, because
# nothing has failed. It simply is not running.
#
# Render is one of several that can do this; Railway and Fly are equivalent, and
# a plain VPS running both under a process manager is fine too. What matters is
# that something runs `npm run worker`.
#
# Nothing here is secret. Every value marked `sync: false` must be set in the
# Render dashboard, on BOTH services — they share a database and an API key.
#
# The host also has to be modern enough to build Next.js. A deploy to shared
# hosting failed with `GLIBC_2.29 not found` from @next/swc-linux-x64-gnu:
# Next's native compiler needs glibc 2.29, which is Ubuntu 19.04 era, and older
# CentOS-derived hosts are far behind that. Node itself is pinned in
# `.node-version`; the OS underneath it is why a managed platform is worth the
# money here.

services:
  - type: web
    name: my-project-builder
    runtime: node
    plan: starter
    # `--include=dev` is not optional. Render sets NODE_ENV=production, npm
    # reads that as `omit=dev`, and the build then runs without the tools it is
    # made of. Reproduced against this lockfile: `tailwindcss` and
    # `@tailwindcss/postcss` disappear, so the stylesheet cannot compile.
    #
    # It is worth knowing this is partial. `typescript` and `prisma` survive as
    # transitive dependencies of production packages, so the failure is not the
    # clean "nothing dev is here" you might assume — it is a handful of specific
    # absences, which is harder to recognise from the error.
    #
    # `prisma generate` runs before the build, not in postinstall: a cached
    # install skips postinstall and the build then fails on a missing client.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Migrations run between the build and the server starting, so a deploy
    # whose schema has moved never serves traffic against the old one. Nothing
    # ran them before this line existed.
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      # Must be the public URL of THIS service. Google's redirect and the
      # Paystack callback are both built from it, so a stale value sends paying
      # students to a host that no longer exists.
      - key: BETTER_AUTH_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: anthropic
      # Refused at boot if left on the development defaults — see
      # `assertProductionDrivers` in src/lib/env.ts.
      - key: EMAIL_DRIVER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: project-files
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false

  - type: worker
    name: my-project-builder-worker
    runtime: node
    plan: starter
    # Same `--include=dev`, and here it matters at RUNTIME rather than only at
    # build time. `tsx` is a devDependency, it is what `npm run worker` starts,
    # and it is one of the six that a production install genuinely drops —
    # nothing in `dependencies` pulls it in. Built without it this service
    # compiles happily and then fails on every boot, so the queue is never
    # claimed from, and a project stuck at "Generating" reports no error
    # because nothing errored.
    #
    # No migrations here. The web service runs them; two services racing the
    # same migration is how a deploy deadlocks.
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # A worker claims only jobs queued for its OWN provider, and it reads this
      # once at startup. A worker booted with the wrong value cannot pick up the
      # queue at all — which is the safe direction, and is why the mismatch that
      # once wrote placeholder prose into a real project cannot recur.
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      # The worker writes exported documents, so it needs the same storage as
      # the web service. Pointing them at different buckets produces exports the
      # download route cannot find.
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: project-files
      - key: EMAIL_DRIVER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
