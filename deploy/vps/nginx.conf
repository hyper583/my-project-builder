# nginx in front of the Next.js server.
#
#   sudo cp deploy/vps/nginx.conf /etc/nginx/sites-available/my-project-builder
#   sudo ln -s /etc/nginx/sites-available/my-project-builder /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot add TLS, which rewrites this file to add the 443 block and a
# redirect:
#   sudo certbot --nginx -d your-domain
#
# Run certbot BEFORE setting BETTER_AUTH_URL to https, or every reset link and
# Paystack callback points at a URL that redirects mid-flow.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain;

    # Uploaded sources are PDFs and Word files. The app's own ceiling is
    # MAX_UPLOAD_MB; nginx must not refuse first, or the student gets a bare
    # 413 from a server that never reached the application.
    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Better Auth builds callback URLs from this. Without it, an HTTPS
        # sign-in redirects to http:// and the cookie is dropped.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Generation progress and the assistant are Server-Sent Events. Both
        # already send `X-Accel-Buffering: no`, which nginx honours per
        # response — so this is the belt: without it a buffered proxy holds the
        # stream and the progress panel looks frozen while the work is running
        # perfectly.
        proxy_buffering off;
        proxy_cache off;

        # Generating a chapter takes minutes. The default 60s read timeout
        # would cut the stream and make a working run look like a failure.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
